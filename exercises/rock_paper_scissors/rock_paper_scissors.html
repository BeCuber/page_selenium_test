<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Test & Learn</title>
        <link rel="stylesheet" href="../../styles.css">
        <link rel="stylesheet" href="./style_rock_paper_scissors.css">
        <script src="./script_rock_paper_scissors.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    </head>
    <body>
        <!--"Header"-->
        <div class="header">
            <div class="presentation">
                <div class="title">
                    <div class="text1">Try Everything</div>
                </div>
                <div class="menu" id="homemenu">
                    <button id="homebtn" class="link" onclick="window.location.href='../../index.html'"><img id="homeicon" src="../../images/home.png" alt="home"></button>
                </div>
            </div>
        </div>
        <div class="information">
            <div class="titleinfo">Rock | Paper | Scissors</div>
        </div>
        <!--"FIN 'Header'"-->
        
        <div class="rock_paper_scissors">

            <div class="container">
                <div id="weapons">
                    <div class="card">
                        <button id="rock"></button>
                    </div>
                    <div class="card">
                        <button id="paper"></button>
                    </div>
                    <div class="card">
                        <button id="scissors"></button>
                    </div>
                </div>
                <div id="outputs">
                    <div class="players">
                        <div class="p_title">Player</div>
                        <div class="selection" id="playerSel"></div>
                        <div class="score" id="playerScore"></div>
                    </div>
                    <div id="result"></div>
                    <div class="players">
                        <div class="p_title">Computer</div>
                        <div class="selection "id="computerSel"></div>
                        <div class="score" id="computerScore"></div>
                    </div>
                </div>
            </div>

            
        </div>



        <!--"Footer"-->
        <div class="quotes">
            <div class="quotetext" id="exercisesquotes">
                <div class="titleinfo">Test & Learn</div>                
            </div>
        </div>
            
        <div class="footer">
            <div class="footer-left">Based on the <a href="https://www.theodinproject.com/lessons/foundations-landing-page">&#169 The Odin Project 2021 Landing Page</a></div>
            <div class="footer-right">Made by <a href="https://github.com/BeCuber">&#169 Feliniberto McFalso 2024</a></div>
        </div>
        <!--"FIN 'Footer'"-->
    </body>
</html>
